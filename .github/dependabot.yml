version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Batch routine dev-tooling bumps (webpack, babel, eslint, loaders) into one PR
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # Security fixes land together, separately from routine updates
      security:
        applies-to: security-updates
        patterns:
          - "*"
    # springroll and any major version bumps still get their own PRs for individual review
